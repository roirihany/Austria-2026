<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#143d35">
<title>אוסטריה 2026 🇦🇹</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f1e9;color:#18322d}
header{position:sticky;top:0;z-index:5;background:#143d35;color:white;padding:18px 16px 12px;box-shadow:0 2px 10px #0002}
h1{margin:0;font-size:24px}.sub{opacity:.8;margin-top:4px;font-size:13px}
nav{display:flex;gap:8px;overflow:auto;padding-top:12px}.tab{border:0;border-radius:18px;padding:8px 13px;white-space:nowrap;background:#ffffff20;color:white}.tab.active{background:#fff;color:#143d35}
main{max-width:760px;margin:auto;padding:16px}.hero{background:white;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 3px 16px #0001}
.hero h2{margin:0 0 4px}.timeline{position:relative}.item{background:white;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 2px 12px #0001}
.time{font-weight:bold;color:#9a5b32;font-size:17px}.desc{margin:6px 0 12px;line-height:1.35}
.actions{display:flex;gap:8px}.btn{display:inline-block;text-decoration:none;border:0;border-radius:10px;padding:9px 11px;background:#e7efe9;color:#143d35;font-weight:bold;font-size:13px}
.mapbox{background:#dfe9e3;border-radius:18px;padding:16px;margin:14px 0}.pins{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.pin{background:white;padding:10px;border-radius:12px;text-decoration:none;color:#18322d;font-size:13px}
.note{font-size:12px;opacity:.7;margin-top:12px}
.alt-intro{margin:8px 0 0;font-size:14px;line-height:1.45;color:#49615b}
.alt-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
.alt-card{background:white;border:2px solid #dfe9e3;border-radius:18px;padding:14px;box-shadow:0 2px 12px #0001}
.alt-card.recommended{border-color:#9a5b32;background:#fffaf5}
.alt-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.alt-title{font-weight:bold;font-size:18px;color:#143d35}
.badge{background:#9a5b32;color:white;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:bold;white-space:nowrap}
.alt-reason{background:#f4eadf;border-radius:12px;padding:10px 12px;margin:10px 0 12px;line-height:1.45;font-size:13px;color:#6c452d}
.alt-card .timeline{margin-top:10px}
.alt-card .item{background:#f9faf8;box-shadow:none;border:1px solid #edf1ee}
@media(min-width:650px){.pins{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body>
<header><h1>אוסטריה 2026 🇦🇹</h1><div class="sub">Familienhotel Felsenhof • 22.9–2.10</div><nav id="nav"></nav></header>
<main><section id="content"></section></main>
<script>
const days = [["22.9", "שלישי", "הגעה והתאקלמות", [["15:00", "הגעה והתארגנות ב-Familienhotel Felsenhof", "Familienhotel Felsenhof Flachau"], ["16:00", "בריכה, משחקייה ומנוחה במלון", "Familienhotel Felsenhof Flachau"], ["18:00", "ארוחת ערב במלון", "Familienhotel Felsenhof Flachau"]]], ["23.9", "רביעי", "יום עם שתי חלופות", []], ["24.9", "חמישי", "Hopsiland Planai + Schladming", [["08:30", "יציאה", "Familienhotel Felsenhof Flachau"], ["09:30", "Planai – עלייה ברכבל", "Planai Schladming"], ["10:00", "Hopsiland", "Hopsiland Planai"], ["13:30", "ארוחת צהריים על ההר", "Planai Schladming"], ["15:45", "Schladming – סיבוב וגלידה", "Schladming"], ["17:15", "חזרה למלון", "Familienhotel Felsenhof Flachau"]]], ["25.9", "שישי", "Wildpark + Alles Alm – יום קצר", [["08:30", "יציאה", "Familienhotel Felsenhof Flachau"], ["09:00", "Wild- & Freizeitpark Untertauern", "Wildpark Untertauern"], ["11:45", "Alles Alm / Gnadenalm", "Alles Alm Gnadenalm"], ["13:30", "ארוחת צהריים", "Gnadenalm"], ["14:45", "חזרה למלון והתארגנות לערב חג", "Familienhotel Felsenhof Flachau"]]], ["26.9", "שבת", "Hallstatt + Gosausee", [["07:45", "יציאה מוקדמת", "Familienhotel Felsenhof Flachau"], ["09:00", "Hallstatt", "Hallstatt"], ["09:15", "Funicular + Skywalk", "Hallstatt Skywalk"], ["10:45", "העיר העתיקה והאגם", "Hallstatt Market Square"], ["12:45", "ארוחת צהריים", "Hallstatt"], ["14:25", "Gosausee", "Vorderer Gosausee"], ["16:45", "יציאה למלון", "Familienhotel Felsenhof Flachau"]]], ["27.9", "ראשון", "מכרה המלח + Königssee", [["08:00", "יציאה לגרמניה", "Familienhotel Felsenhof Flachau"], ["09:30", "Berchtesgaden Salt Mine", "Salzbergwerk Berchtesgaden"], ["11:45", "Königssee", "Königssee"], ["13:00", "שיט ל-St. Bartholomä", "St Bartholomä Königssee"], ["16:30", "חזרה למלון", "Familienhotel Felsenhof Flachau"]]], ["28.9", "שני", "זלצבורג – מוצרט + Haus der Natur", [["08:30", "יציאה לזלצבורג", "Familienhotel Felsenhof Flachau"], ["10:00", "Mozart's Birthplace", "Mozarts Geburtshaus Salzburg"], ["11:30", "Café Fürst – Mozartkugel", "Cafe Furst Salzburg"], ["13:00", "Haus der Natur – הפעלת חלון הכרטיס", "Haus der Natur Salzburg"], ["16:30", "חזרה למלון", "Familienhotel Felsenhof Flachau"]]], ["29.9", "שלישי", "Hellbrunn + Salzburg Zoo", [["08:15", "יציאה", "Familienhotel Felsenhof Flachau"], ["09:30", "Hellbrunn Palace + Trick Fountains", "Hellbrunn Palace Salzburg"], ["11:15", "Salzburg Zoo", "Salzburg Zoo Hellbrunn"], ["14:30", "יציאה למלון", "Familienhotel Felsenhof Flachau"]]], ["30.9", "רביעי", "Prinzenberg Natrun + Maria Alm", [["08:30", "יציאה", "Familienhotel Felsenhof Flachau"], ["09:45", "Natrunbahn", "Natrunbahn Maria Alm"], ["10:00", "Prinzenberg + Forest Slide Park", "Prinzenberg Natrun Maria Alm"], ["13:30", "ארוחת צהריים", "Maria Alm"], ["15:00", "Maria Alm – כפר, כנסייה וגלידה", "Maria Alm"], ["16:00", "חזרה למלון", "Familienhotel Felsenhof Flachau"]]], ["1.10", "חמישי", "Gradenbach + Therme Amadé", [["08:30", "יציאה", "Familienhotel Felsenhof Flachau"], ["09:30", "The Treasure of Gradenbach", "Gradenbach Weissenbach bei Haus"], ["12:00", "ארוחת צהריים", "Haus im Ennstal"], ["14:30", "Therme Amadé – 4 שעות", "Erlebnis-Therme Amade Altenmarkt"], ["18:45", "חזרה למלון", "Familienhotel Felsenhof Flachau"]]], ["2.10", "שישי", "עזיבה", [["08:00", "ארוחת בוקר, אריזה ו-Check-out", "Familienhotel Felsenhof Flachau"]]]];

const day23Options = [
  {
    title:"חלופה 1",
    subtitle:"Hohenwerfen → Wengsee → Flori's",
    recommended:false,
    stops:[
      ["08:30","יציאה מהמלון","Familienhotel Felsenhof Flachau"],
      ["09:00","Burg Hohenwerfen – טירה וסיור","Burg Hohenwerfen"],
      ["12:15","Wengsee – עצירה רגועה ליד האגם","Wengsee Werfenweng"],
      ["14:30","Starjet 1 ועלייה ל-Flori's Erlebnispfad","Starjet 1 Flachau"],
      ["14:45","Flori's Erlebnispfad – מסלול משפחתי","Flori's Erlebnispfad Flachau"],
      ["17:00","חזרה למלון","Familienhotel Felsenhof Flachau"]
    ]
  },
  {
    title:"חלופה 2",
    subtitle:"Hohenwerfen → מופע עופות דורסים → Flori's",
    recommended:true,
    reason:"מומלץ: בסוף ספטמבר מתחם הרחצה/הפנאי של Wengsee אינו פעיל, ולכן עדיף לתת יותר זמן לטירה, למופע עופות הדורסים ול-Flori's. את Wolfgangsee / St. Wolfgang / St. Gilgen עדיף לשמור ליום נפרד.",
    stops:[
      ["08:30","יציאה מהמלון","Familienhotel Felsenhof Flachau"],
      ["09:00","Burg Hohenwerfen – טירה וסיור","Burg Hohenwerfen"],
      ["11:15","מופע עופות דורסים","Burg Hohenwerfen"],
      ["13:15","נסיעה חזרה לכיוון Flachau + ארוחת צהריים","Flachau"],
      ["14:30","Starjet 1 ועלייה ל-Flori's Erlebnispfad","Starjet 1 Flachau"],
      ["14:45","Flori's Erlebnispfad – מסלול משפחתי","Flori's Erlebnispfad Flachau"],
      ["17:00","חזרה למלון","Familienhotel Felsenhof Flachau"]
    ]
  }
];

let current=0;
function maps(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}
function route(stops){
 let qs=stops.map(x=>x[2]).filter(Boolean); if(qs.length<2)return maps(qs[0]||'Familienhotel Felsenhof Flachau');
 let o=encodeURIComponent(qs[0]), d=encodeURIComponent(qs[qs.length-1]), w=qs.slice(1,-1).map(encodeURIComponent).join('%7C');
 return `https://www.google.com/maps/dir/?api=1&origin=${o}&destination=${d}${w?'&waypoints='+w:''}&travelmode=driving`;
}
function render(){
 const nav=document.getElementById('nav');
 nav.innerHTML=days.map((d,i)=>`<button class="tab ${i===current?'active':''}" onclick="current=${i};render()">${d[0]}</button>`).join('');
 const d=days[current];

 if(d[0]==="23.9"){
  document.getElementById('content').innerHTML=`
   <div class="hero">
    <h2>${d[1]} ${d[0]} — בחרו מסלול ליום הזה</h2>
    <div class="alt-intro">אלו <b>שתי חלופות נפרדות</b> לאותו יום — לא שתי נקודות שצריך להספיק ברצף.</div>
   </div>
   <div class="alt-grid">
    ${day23Options.map(opt=>`
      <section class="alt-card ${opt.recommended?'recommended':''}">
       <div class="alt-head">
        <div>
         <div class="alt-title">${opt.title}</div>
         <div class="desc">${opt.subtitle}</div>
        </div>
        ${opt.recommended?'<span class="badge">⭐ מומלץ</span>':''}
       </div>
       ${opt.reason?`<div class="alt-reason">💡 ${opt.reason}</div>`:''}
       <div class="actions"><a class="btn" target="_blank" href="${route(opt.stops)}">🗺️ מסלול החלופה ב-Google Maps</a></div>
       <div class="timeline">
        ${opt.stops.map(s=>`<div class="item"><div class="time">${s[0]}</div><div class="desc">${s[1]}</div><div class="actions"><a class="btn" target="_blank" href="${maps(s[2])}">📍 פתח במפה</a></div></div>`).join('')}
       </div>
      </section>
    `).join('')}
   </div>
   <div class="mapbox">
    <b>ℹ️ חשוב</b>
    <div class="note">בחרו רק אחת מהחלופות. שעות עשויות להשתנות לפי מזג אוויר, עומסים ושעות פעילות בפועל.</div>
   </div>`;
 } else {
  const stops=d[3];
  document.getElementById('content').innerHTML=`
   <div class="hero"><h2>${d[1]} ${d[0]} — ${d[2]}</h2>
   <div class="actions"><a class="btn" target="_blank" href="${route(stops)}">🗺️ מסלול היום ב-Google Maps</a></div></div>
   <div class="timeline">${stops.map(s=>`<div class="item"><div class="time">${s[0]}</div><div class="desc">${s[1]}</div><div class="actions"><a class="btn" target="_blank" href="${maps(s[2])}">📍 פתח במפה</a></div></div>`).join('')}</div>
   <div class="mapbox"><b>📌 נקודות היום</b><div class="pins">${stops.filter(s=>s[2]).map(s=>`<a class="pin" target="_blank" href="${maps(s[2])}">📍 ${s[1]}</a>`).join('')}</div>
   <div class="note">הקישורים פותחים ניווט/חיפוש ב-Google Maps. שעות עשויות להשתנות לפי מזג אוויר, עומסים ושעות פעילות בפועל.</div></div>`;
 }
 document.querySelector('.tab.active')?.scrollIntoView({inline:'center',block:'nearest'});
}
render();
</script></body></html>
