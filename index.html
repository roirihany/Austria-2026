function profilePayload(){return {device_id:getDeviceId(),device_name:detectDeviceName(),display_name:localStorage.getItem(PROFILE_NAME_KEY)||detectDeviceName(),avatar_data:localStorage.getItem(PROFILE_IMAGE_KEY)||defaultProfileImage(),last_seen:new Date().toISOString()}}
async function syncProfile(countVisit=false){if(!db)return;try{const p=profilePayload();let visits=1;if(countVisit){const {data}=await db.from('profiles').select('visits').eq('device_id',p.device_id).maybeSingle();visits=(data?.visits||0)+1}else delete p.visits;if(countVisit)p.visits=visits;await db.from('profiles').upsert(p,{onConflict:'device_id'});trackEvent(countVisit?'app_open':'profile_sync')}catch(e){console.warn('profile sync',e)}}
async function pullProfile(){if(!db)return;try{const {data}=await db.from('profiles').select('*').eq('device_id',getDeviceId()).maybeSingle();if(data){if(data.display_name)localStorage.setItem(PROFILE_NAME_KEY,data.display_name);if(data.avatar_data)localStorage.setItem(PROFILE_IMAGE_KEY,data.avatar_data);loadProfile()}}catch(e){}}
async function trackEvent(name,meta={}){if(!db)return;try{await db.from('events').insert({device_id:getDeviceId(),event_name:name,meta})}catch(e){}}
function sharedState(){return db?'<span class="sharedbadge">☁️ משותף</span>':'<span class="sharedbadge off">📱 מקומי בלבד</span>'}
function esc(v=''){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function compressImage(file,max=256){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let w=im.width,h=im.height;if(w>h&&w>max){h*=max/w;w=max}else if(h>max){w*=max/h;h=max}const c=document.createElement('canvas');c.width=Math.round(w);c.height=Math.round(h);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function saveSharedSettings(){const u=document.getElementById('sharedUrl').value.trim(),k=document.getElementById('sharedKey').value.trim();if(!u||!k)return alert('יש להדביק Project URL ו-anon public key');localStorage.setItem(SHARED_URL_KEY,u);localStorage.setItem(SHARED_ANON_KEY,k);initDb();await syncProfile(true);alert('החיבור המשותף נשמר במכשיר הזה ✅');developerPage()}
function clearSharedSettings(){if(!confirm('לנתק את החיבור המשותף מהמכשיר הזה?'))return;localStorage.removeItem(SHARED_URL_KEY);localStorage.removeItem(SHARED_ANON_KEY);db=null;developerPage()}
function supabaseSql(){return `create table if not exists profiles (device_id text primary key, device_name text, display_name text, avatar_data text, first_seen timestamptz default now(), last_seen timestamptz default now(), visits int default 0);\ncreate table if not exists equipment (id bigint generated by default as identity primary key, name text not null, checked boolean default false, added_by text, created_at timestamptz default now());\ncreate table if not exists events (id bigint generated by default as identity primary key, device_id text, event_name text, meta jsonb default '{}'::jsonb, created_at timestamptz default now());\nalter table profiles disable row level security; alter table equipment disable row level security; alter table events disable row level security;`}
function copySql(){navigator.clipboard?.writeText(supabaseSql());alert('ה-SQL הועתק ✅')}
async function ensureDefaultGear(){if(!db)return;try{const {count}=await db.from('equipment').select('*',{count:'exact',head:true});if(!count){await db.from('equipment').insert(DEFAULT_GEAR.map(x=>({name:x,added_by:getDeviceId()})))}}catch(e){}}
async function gearPage(){const el=document.getElementById('gear');if(!el)return;el.innerHTML=`<div class="card"><div class="gearhead"><div class="section">🧳 רשימת ציוד</div>${sharedState()}</div><div class="gearadd"><input id="gearInput" maxlength="80" placeholder="הוסף ציוד…" onkeydown="if(event.key==='Enter')addGear()"><button onclick="addGear()">＋ הוסף</button></div><div id="gearList"><div class="muted">טוען…</div></div><div class="muted" style="margin-top:8px">בחיבור משותף, כל הוספה, סימון או מחיקה מתעדכנים אצל כולם.</div></div>`;await refreshGear()}
async function refreshGear(){const box=document.getElementById('gearList');if(!box)return;if(db){try{await ensureDefaultGear();const {data,error}=await db.from('equipment').select('*').order('created_at',{ascending:true});if(error)throw error;box.innerHTML=(data||[]).map(x=>`<div class="gearrow ${x.checked?'done':''}"><input type="checkbox" ${x.checked?'checked':''} onchange="toggleGear('${x.id}',this.checked)"><span class="gearname">${esc(x.name)}</span><button class="trash" onclick="deleteGear('${x.id}')">🗑️</button></div>`).join('')||'<div class="muted">הרשימה ריקה.</div>';return}catch(e){box.innerHTML='<div class="muted">החיבור המשותף לא זמין כרגע. מוצגת הרשימה המקומית.</div>'}}
let a=loadJSON('austria_local_gear',null);if(!a){a=DEFAULT_GEAR.map((name,i)=>({id:'l'+i,name,checked:false}));localStorage.setItem('austria_local_gear',JSON.stringify(a))}box.innerHTML=a.map(x=>`<div class="gearrow ${x.checked?'done':''}"><input type="checkbox" ${x.checked?'checked':''} onchange="toggleGear('${x.id}',this.checked)"><span class="gearname">${esc(x.name)}</span><button class="trash" onclick="deleteGear('${x.id}')">🗑️</button></div>`).join('')}
async function addGear(){const inp=document.getElementById('gearInput'),name=(inp?.value||'').trim();if(!name)return;if(db){await db.from('equipment').insert({name,added_by:getDeviceId()});trackEvent('gear_added',{name})}else{let a=loadJSON('austria_local_gear',[]);a.push({id:'l'+Date.now(),name,checked:false});localStorage.setItem('austria_local_gear',JSON.stringify(a))}inp.value='';refreshGear()}
async function toggleGear(id,v){if(db){await db.from('equipment').update({checked:v}).eq('id',id);trackEvent('gear_toggled',{id,checked:v})}else{let a=loadJSON('austria_local_gear',[]);const x=a.find(y=>y.id===id);if(x)x.checked=v;localStorage.setItem('austria_local_gear',JSON.stringify(a))}refreshGear()}
async function deleteGear(id){if(!confirm('למחוק את הפריט מהרשימה?'))return;if(db){await db.from('equipment').delete().eq('id',id);trackEvent('gear_deleted',{id})}else{let a=loadJSON('austria_local_gear',[]).filter(x=>x.id!==id);localStorage.setItem('austria_local_gear',JSON.stringify(a))}refreshGear()}
function weatherPage(){const el=document.getElementById('weather');el.innerHTML=`<div class="card"><div class="gearhead"><div class="section">🌦️ מזג אוויר בפלאכאו</div><button class="btn" onclick="loadWeatherInto('weatherFull')">↻ רענון</button></div><div id="weatherFull"><div class="muted">טוען תחזית…</div></div><div class="muted" style="margin-top:8px">תחזית Open‑Meteo ל־5 ימים. סמוך לטיול נשתמש בה להתאמות למסלול.</div></div>`;loadWeatherInto('weatherFull');trackEvent('weather_opened')}
async function loadWeatherInto(id){const el=document.getElementById(id);if(!el)return;try{const u='https://api.open-meteo.com/v1/forecast?latitude=47.344&longitude=13.391&current=temperature_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FVienna&forecast_days=5';const r=await fetch(u);const j=await r.json();const now=`<div style="display:flex;align-items:center;gap:14px;background:#f6f8f6;padding:13px;border-radius:13px;margin-bottom:8px"><div style="font-size:34px">${weatherIcon(j.current.weather_code)}</div><div><b style="font-size:23px">${Math.round(j.current.temperature_2m)}°</b><div class="muted">מרגיש כמו ${Math.round(j.current.apparent_temperature)}° • פלאכאו עכשיו</div></div></div>`;el.innerHTML=now+j.daily.time.map((t,i)=>`<div class="weatherrow"><span>${weatherIcon(j.daily.weather_code[i])} ${new Date(t+'T12:00:00').toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'numeric'})}</span><b>${Math.round(j.daily.temperature_2m_min[i])}°–${Math.round(j.daily.temperature_2m_max[i])}°</b><span>🌧️ ${j.daily.precipitation_probability_max[i]??0}%</span></div>`).join('')}catch(e){el.innerHTML='<div class="muted">לא הצלחנו לטעון תחזית כרגע.</div>'}}

async function developerPage(){const el=document.getElementById('developer');if(!el)return;const u=localStorage.getItem(SHARED_URL_KEY)||'',k=localStorage.getItem(SHARED_ANON_KEY)||'';el.innerHTML=`<div class="card"><div class="gearhead"><div class="section">🛠️ מרכז מפתחים</div>${sharedState()}</div><div id="devStats"><div class="muted">טוען סטטיסטיקות…</div></div></div><div class="card"><div class="section">👥 מכשירים / משתמשים</div><div id="devUsers"><div class="muted">טוען…</div></div></div><div class="card"><div class="section">☁️ חיבור נתונים משותפים</div><div class="muted">Supabase משמש לרשימת הציוד, פרופילים וסטטיסטיקות של כל המכשירים.</div><input class="modalinput" id="sharedUrl" value="${esc(u)}" placeholder="Project URL"><input class="modalinput" id="sharedKey" value="${esc(k)}" placeholder="anon public key"><div class="buttons"><button class="btn primary" onclick="saveSharedSettings()">💾 שמור וחבר</button>${db?'<button class="btn" onclick="clearSharedSettings()">נתק</button>':''}<button class="btn" onclick="copySql()">📋 העתק SQL להקמה</button></div><div class="setupbox"><b>הקמה חד־פעמית:</b><div class="muted">ב־Supabase פותחים SQL Editor, מריצים את ה־SQL שהכפתור מעתיק, ואז מדביקים כאן URL ו־anon key.</div></div></div>`;if(db)loadDeveloperData();else{document.getElementById('devStats').innerHTML='<div class="muted">חבר Supabase כדי לראות סטטיסטיקות מכל המשתמשים.</div>';document.getElementById('devUsers').innerHTML='<div class="muted">עדיין אין נתונים משותפים.</div>'}}
async function loadDeveloperData(){try{const [{data:users},{data:events}]=await Promise.all([db.from('profiles').select('*').order('last_seen',{ascending:false}),db.from('events').select('id,event_name,created_at').order('created_at',{ascending:false}).limit(500)]);const us=users||[],ev=events||[];const today=new Date();today.setHours(0,0,0,0);const opens=ev.filter(x=>x.event_name==='app_open').length,todayEvents=ev.filter(x=>new Date(x.created_at)>=today).length;document.getElementById('devStats').innerHTML=`<div class="devstats"><div class="statbox"><div class="statnum">${us.length}</div><div>מכשירים</div></div><div class="statbox"><div class="statnum">${opens}</div><div>כניסות</div></div><div class="statbox"><div class="statnum">${todayEvents}</div><div>פעולות היום</div></div><div class="statbox"><div class="statnum">${ev.length}</div><div>אירועים אחרונים</div></div></div>`;document.getElementById('devUsers').innerHTML=us.map(x=>`<div class="userrow"><img src="${esc(x.avatar_data||defaultProfileImage())}"><div><b>${esc(x.display_name||x.device_name||'מכשיר')}</b><div class="mini">${esc(x.device_name||'')} • ${x.visits||0} כניסות</div><div class="mini">נראה לאחרונה ${x.last_seen?new Date(x.last_seen).toLocaleString('he-IL'):''}</div></div><div class="devactions"><button onclick="devRename('${esc(x.device_id)}','${esc(x.display_name||'')}')">✏️</button><button onclick="devPhoto('${esc(x.device_id)}')">📷</button></div></div>`).join('')||'<div class="muted">אין משתמשים עדיין.</div>'}catch(e){document.getElementById('devStats').innerHTML='<div class="muted">לא הצלחנו לקרוא את הסטטיסטיקות. בדוק את החיבור והטבלאות.</div>'}}
async function devRename(id,current){const n=prompt('שם חדש למשתמש:',current);if(n===null||!n.trim())return;await db.from('profiles').update({display_name:n.trim()}).eq('device_id',id);trackEvent('developer_renamed_user',{target:id});loadDeveloperData();if(id===getDeviceId()){localStorage.setItem(PROFILE_NAME_KEY,n.trim());loadProfile()}}

function updateStatus(){
 const start=new Date(2026,8,22),end=new Date(2026,9,2,23,59,59),now=new Date(),el=document.getElementById('tripStatus'),bar=document.getElementById('progressBar');
 const dayMs=86400000;
 if(now<start){const n=Math.ceil((start-now)/dayMs);el.firstChild.nodeValue=`עוד ${n} ימים לטיול ✈️`;bar.style.width='0%'}
 else if(now>end){el.firstChild.nodeValue='הטיול הסתיים ❤️';bar.style.width='100%'}

}

function saveNotes(v){localStorage.setItem(STORE.notes,v)}
function weatherIcon(code){if(code===0)return'☀️';if([1,2].includes(code))return'🌤️';if(code===3)return'☁️';if([45,48].includes(code))return'🌫️';if(code>=51&&code<=67)return'🌧️';if(code>=71&&code<=77)return'🌨️';if(code>=80&&code<=82)return'🌦️';if(code>=95)return'⛈️';return'🌡️'}
async function loadWeather(){const el=document.getElementById('weatherBox');if(!el)return;try{const u='https://api.open-meteo.com/v1/forecast?latitude=47.344&longitude=13.391&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FVienna&forecast_days=5';const r=await fetch(u);const j=await r.json();el.innerHTML=j.daily.time.map((t,i)=>`<div class="weatherrow"><span>${weatherIcon(j.daily.weather_code[i])} ${new Date(t+'T12:00:00').toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'numeric'})}</span><b>${Math.round(j.daily.temperature_2m_min[i])}°–${Math.round(j.daily.temperature_2m_max[i])}°</b><span>🌧️ ${j.daily.precipitation_probability_max[i]??0}%</span></div>`).join('')}catch(e){el.innerHTML='<div class="muted">לא הצלחנו לטעון תחזית כרגע. נסה שוב מאוחר יותר.</div>'}}
function toolsPage(){const notes=localStorage.getItem(STORE.notes)||'';document.getElementById('tools').innerHTML=`<div class="toolgrid"><div class="toolcard" onclick="view('weather')"><h3>🌦️ מזג אוויר</h3><div class="desc">תחזית חיה לפלאכאו</div><button class="btn primary">פתח תחזית</button></div><div class="toolcard" onclick="view('gear')"><h3>🧳 רשימת ציוד</h3><div class="desc">רשימה משותפת לכל המשפחה</div><button class="btn primary">פתח רשימה</button></div><div class="toolcard"><h3>🏨 Felsenhof</h3><div class="desc">Kreuzmoosstraße 88<br>5542 Flachau, Austria</div><div class="buttons"><a class="btn primary" target="_blank" href="${gm('Familienhotel Felsenhof Flachau')}">📍 ניווט</a><a class="btn" target="_blank" href="https://booking.felsenhof.com/">🔗 הזמנה</a></div></div><div class="toolcard"><h3>🆘 חירום באירופה</h3><div class="desc">מספר חירום כללי באיחוד האירופי</div><div class="emergency"><a href="tel:112">📞 112</a><a target="_blank" href="${gm('Krankenhaus Schwarzach Austria')}">🏥 בית חולים</a></div></div></div><div class="card"><div class="section">📝 הערות לטיול</div><textarea class="notearea" placeholder="מספר חדר, דברים לקנות, שינויים במסלול…" oninput="saveNotes(this.value)">${notes.replace(/</g,'&lt;')}</textarea><div class="muted">נשמר אוטומטית בטלפון הזה.</div></div>`}
function view(v){['trip','extras','tools','weather','gear','developer'].forEach(id=>document.getElementById(id)?.classList.toggle('hide',v!==id));bt.classList.toggle('on',v==='trip');be.classList.toggle('on',v==='extras');bg.classList.toggle('on',v==='gear');bu.classList.toggle('on',v==='tools');if(v==='extras')extras();if(v==='tools')toolsPage();if(v==='weather')weatherPage();if(v==='gear'){gearPage();trackEvent('gear_opened')}if(v==='developer')developerPage()}
initDb(); extras();toolsPage();updateStatus();render();loadProfile(); if(db){pullProfile();syncProfile(true)}
</script></body></html>
